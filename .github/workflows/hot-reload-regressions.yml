name: Pydux hot reload and Inspector regressions
on:
  pull_request:
  push:
    branches: [fixes/inspector-state-hot-reload]
jobs:
  hot-reload:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_hot_reload_schema.py
