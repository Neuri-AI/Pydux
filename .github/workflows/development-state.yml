name: Development state recovery

on:
  push:
    paths:
      - 'pydux/core/**'
      - 'pydux/devtools/state_snapshot.py'
      - 'tests/test_development_state_snapshot.py'
      - '.github/workflows/development-state.yml'
  pull_request:
    paths:
      - 'pydux/core/**'
      - 'pydux/devtools/state_snapshot.py'
      - 'tests/test_development_state_snapshot.py'
      - '.github/workflows/development-state.yml'

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_development_state_snapshot.py tests/test_core.py
